<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Riviera 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro">
      <p class="eyebrow">VIT STUDENT FESTIVAL</p>
      <h1>Riviera <span>2026</span></h1>
      <p>Four days. Great music. Unforgettable memories.</p>
      <img src="https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=1000" alt="Concert crowd">
    </section>
    <section class="login-panel">
      <h2>Welcome to Riviera</h2>
      <p class="text-muted">Sign in or create your student profile to continue.</p>
      <div class="btn-group w-100 mb-4" role="group">
        <button type="button" class="btn btn-primary" id="showLogin">Login</button>
        <button type="button" class="btn btn-outline-primary" id="showSignup">Create Profile</button>
      </div>
      <form id="entryLoginForm">
        <div class="mb-3"><label class="form-label" for="entryEmail">Email address</label><input class="form-control" type="email" id="entryEmail" required placeholder="you@example.com"></div>
        <div class="mb-3"><label class="form-label" for="entryPassword">Password</label><input class="form-control" type="password" id="entryPassword" required placeholder="Enter password"></div>
        <button class="btn btn-primary w-100" type="submit">Login and continue</button>
      </form>
      <form id="entrySignupForm" class="d-none">
        <div class="mb-3"><label class="form-label" for="newName">Full name</label><input class="form-control" type="text" id="newName" required placeholder="Enter your name"></div>
        <div class="mb-3"><label class="form-label" for="newEmail">Email address</label><input class="form-control" type="email" id="newEmail" required placeholder="you@example.com"></div>
        <div class="mb-3"><label class="form-label" for="newStudentId">Student registration number</label><input class="form-control" type="text" id="newStudentId" required placeholder="Enter student ID"></div>
        <div class="mb-3"><label class="form-label" for="newPassword">Create password</label><input class="form-control" type="password" id="newPassword" minlength="4" required placeholder="At least 4 characters"></div>
        <button class="btn btn-primary w-100" type="submit">Create profile</button>
      </form>
      <p id="entryMessage" class="mt-3 small fw-semibold" aria-live="polite"></p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body></html>
