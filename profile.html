<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Riviera 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark site-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" href="home.html">RIVIERA <span>2026</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Passes</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html">My Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>
<main class="container py-5">
  <div class="profile-header mb-4">
    <div class="profile-avatar" id="profileInitials">R</div>
    <div>
      <p class="eyebrow mb-1">RIVIERA 2026 MEMBER</p>
      <h1 class="section-title mb-1" id="profileHeading">My Profile</h1>
      <p class="text-muted mb-0">Your student details in one place.</p>
    </div>
  </div>
  <div class="form-wrap">
    <h2 class="h4 mb-3">Personal information</h2>
    <form id="profileForm">
      <div class="mb-3">
        <label class="form-label" for="profileName">Full name</label>
        <input class="form-control" id="profileName" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="profileEmail">Email address</label>
        <input class="form-control" id="profileEmail" type="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="profileStudentId">Student registration number</label>
        <input class="form-control" id="profileStudentId">
      </div>
      <div class="mb-3">
        <label class="form-label" for="profilePhone">Phone number</label>
        <input class="form-control" id="profilePhone" type="tel" placeholder="Add your phone number">
      </div>
      <div class="mb-3">
        <label class="form-label" for="profileCourse">Course / Department</label>
        <input class="form-control" id="profileCourse" placeholder="e.g. Computer Science">
      </div>
      <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
    <p id="profileMessage" class="mt-3 fw-semibold"></p>
  </div>
</main><footer class="site-footer">Riviera 2026 · Student Front End Design Project</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
