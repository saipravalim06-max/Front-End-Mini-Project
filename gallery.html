        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">

<main class="container py-5">
    <h1 class="section-title">Festival Gallery</h1>
    <p>Highlights from the music, performances and celebrations.</p>
    <div class="gallery-box">
        <img id="galleryImage" src="https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=1000" alt="Concert crowd">
        <p id="galleryCaption">Live music and festival lights</p>
        <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-primary" id="prevImage">Previous</button>
            <button class="btn btn-primary" id="nextImage">Next</button>
        </div>
        <p id="imageSelected" class="fw-bold mt-3"></p>
    </div>
    <div class="row g-3 mt-4">
        <div class="col-md-4">
            <div class="simple-card photo-card" tabindex="0">
                <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=600" alt="Festival audience">
                <p>Festival audience</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="simple-card photo-card" tabindex="0">
                <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?w=600" alt="Live performance">
                <p>Live performance</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="simple-card photo-card" tabindex="0">
                <img src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=600" alt="DJ show">
