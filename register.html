    <link rel="stylesheet" href="css/style.css">
  </head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark site-nav">
  <div class="container"><a class="navbar-brand fw-bold" href="home.html">RIVIERA <span>2026</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Passes</a></li>

          <li class="nav-item"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>
<main class="container py-5">
  <div class="form-wrap">
    <h1 class="section-title">Student Registration</h1>
    <p>Fill in your details to register for Riviera activities.</p>
    <form id="registrationForm">
      <div class="mb-3">
        <label class="form-label" for="studentName">Full name</label>
        <input class="form-control" id="studentName" type="text" placeholder="Enter your name" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="studentEmail">Email</label>
        <input class="form-control" id="studentEmail" type="email" placeholder="name@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="studentId">Student registration number</label>
        <input class="form-control" id="studentId" type="text" placeholder="Enter registration number" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="eventChoice">Choose an event</label>
        <select class="form-select" id="eventChoice">
          <option>Opening Night</option>
          <option>Indie Night</option>
          <option>EDM Night</option>
          <option>Grand Finale</option>
          <option>Multiple events</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Participation type</label>
        <br>
        <input class="form-check-input" type="radio" name="type" value="Participant" checked> Participant
        <input class="form-check-input ms-3" type="radio" name="type" value="Audience"> Audience
      </div>
      <div class="mb-3">
        <label class="form-label" for="phone">Phone number</label>
        <input class="form-control" id="phone" type="tel" placeholder="10-digit phone number">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agree" required>
        <label class="form-check-label" for="agree">I agree to the event guidelines.</label>
      </div>
      <button class="btn btn-primary" type="submit">Submit registration</button>
      <button class="btn btn-outline-secondary" type="reset">Clear</button>
    </form>
    <p id="registerMessage" class="mt-3 fw-semibold"></p>
  </div>
</main>
<footer class="site-footer">Riviera 2026 · VIT, Vellore</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
